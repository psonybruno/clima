<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clima em Registro/SP</title>
  <style>
    :root {
      --bg-top: #0f172a;
      --bg-mid: #1e3a8a;
      --bg-bottom: #0ea5e9;
      --card: rgba(255, 255, 255, 0.16);
      --card-border: rgba(255, 255, 255, 0.35);
      --text-main: #f8fafc;
      --text-soft: #dbeafe;
      --accent: #fde047;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-main);
      background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 55%, var(--bg-bottom) 100%);
      overflow: hidden;
      display: grid;
      place-items: center;
      padding: 2vh 2vw;
    }

    .scene {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .cloud {
      position: absolute;
      opacity: 0.35;
      filter: drop-shadow(0 8px 18px rgba(255,255,255,.2));
      animation: drift linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      background: #fff;
      border-radius: 50%;
    }

    .cloud,
    .cloud::before,
    .cloud::after {
      background: #fff;
      border-radius: 100px;
    }

    .cloud.c1 {
      width: 220px;
      height: 70px;
      top: 10%;
      left: -260px;
      animation-duration: 65s;
    }

    .cloud.c1::before { width: 90px; height: 90px; left: 28px; top: -45px; }
    .cloud.c1::after { width: 120px; height: 120px; right: 28px; top: -65px; }

    .cloud.c2 {
      width: 180px;
      height: 56px;
      top: 24%;
      left: -220px;
      opacity: 0.25;
      animation-duration: 80s;
      animation-delay: -20s;
    }

    .cloud.c2::before { width: 75px; height: 75px; left: 18px; top: -38px; }
    .cloud.c2::after { width: 100px; height: 100px; right: 18px; top: -55px; }

    .cloud.c3 {
      width: 240px;
      height: 78px;
      top: 36%;
      left: -280px;
      opacity: 0.2;
      animation-duration: 95s;
      animation-delay: -35s;
    }

    .cloud.c3::before { width: 100px; height: 100px; left: 32px; top: -50px; }
    .cloud.c3::after { width: 132px; height: 132px; right: 26px; top: -70px; }

    @keyframes drift {
      from { transform: translateX(0); }
      to { transform: translateX(calc(100vw + 360px)); }
    }

    .rain {
      position: absolute;
      inset: 0;
      opacity: 0;
      transition: opacity 0.5s ease;
      overflow: hidden;
    }

    .rain.show {
      opacity: 0.28;
    }

    .drop {
      position: absolute;
      top: -14vh;
      width: 2px;
      height: 22px;
      border-radius: 999px;
      background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,.75));
      transform: rotate(12deg);
      animation: rainDrop linear infinite;
      will-change: transform;
    }

    @keyframes rainDrop {
      from { transform: translate3d(0, 0, 0) rotate(12deg); }
      to { transform: translate3d(-26px, 120vh, 0) rotate(12deg); }
    }

    .card {
      width: min(92vw, 640px);
      min-height: min(94vh, 1600px);
      max-height: 94vh;
      padding: clamp(20px, 3vw, 34px);
      border-radius: clamp(20px, 3vw, 30px);
      border: 1px solid var(--card-border);
      background: var(--card);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
      animation: riseIn .9s ease both;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 22px;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(20px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .city {
      font-size: clamp(1rem, 2vw, 1.4rem);
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--text-soft);
    }

    .weather-main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 16px;
    }

    .icon {
      font-size: clamp(88px, 16vw, 170px);
      order: -1;
      animation: float 3.5s ease-in-out infinite;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.25));
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .temp {
      font-size: clamp(4rem, 14vw, 9rem);
      font-weight: 700;
      line-height: 1;
      transition: color .4s ease, text-shadow .4s ease;
    }

    .clock {
      font-size: clamp(1.6rem, 4vw, 3rem);
      font-weight: 600;
      color: #fef9c3;
      letter-spacing: 0.04em;
      margin-bottom: 10px;
      text-shadow: 0 4px 14px rgba(0,0,0,.25);
    }

    .day-name {
      font-size: clamp(1rem, 2.4vw, 1.6rem);
      color: var(--text-soft);
      letter-spacing: 0.05em;
      text-transform: capitalize;
      margin-bottom: 4px;
    }

    .full-date {
      font-size: clamp(.95rem, 2vw, 1.3rem);
      color: var(--text-soft);
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }

    .description {
      font-size: clamp(1.2rem, 3vw, 2rem);
      color: var(--text-soft);
      text-align: center;
      text-transform: capitalize;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .meta-item {
      border-radius: 14px;
      padding: 16px;
      background: rgba(255,255,255,0.12);
      text-align: center;
    }

    .meta-item small {
      display: block;
      color: var(--text-soft);
      margin-bottom: 6px;
      font-size: clamp(.9rem, 1.8vw, 1.2rem);
      letter-spacing: .04em;
    }

    .meta-item strong {
      font-size: clamp(1.4rem, 3.2vw, 2.4rem);
      transition: color .4s ease, text-shadow .4s ease;
    }

    .is-cold {
      color: #93c5fd;
      text-shadow: 0 0 16px rgba(147, 197, 253, .45);
    }

    .is-hot {
      color: #fb923c;
      text-shadow: 0 0 16px rgba(251, 146, 60, .45);
    }

    .status {
      font-size: clamp(.95rem, 1.6vw, 1.2rem);
      color: #fef9c3;
      min-height: 1.2em;
      text-align: center;
    }

    @media (orientation: landscape) {
      .card {
        width: min(92vw, 980px);
        min-height: auto;
        max-height: none;
      }

      .weather-main {
        flex-direction: row;
        justify-content: space-between;
        text-align: left;
      }

      .icon {
        order: 0;
      }

      .description {
        text-align: left;
      }

      .meta {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-height: 700px) {
      body {
        overflow: auto;
      }

      .card {
        max-height: none;
      }
    }
  </style>
</head>
<body>
  <div class="scene" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="rain" id="rain"></div>
  </div>

  <main class="card">
    <p class="city">Registro/SP</p>
    <div class="weather-main">
      <div>
        <div id="dayName" class="day-name">--</div>
        <div id="fullDate" class="full-date">--</div>
        <div id="clock" class="clock">--:--:--</div>
        <div id="temp" class="temp">--°C</div>
        <p id="description" class="description">Carregando clima...</p>
      </div>
      <div id="icon" class="icon">☁️</div>
    </div>

    <section class="meta">
      <div class="meta-item">
        <small>Sensação</small>
        <strong id="feelsLike">--°C</strong>
      </div>
      <div class="meta-item">
        <small>Umidade</small>
        <strong id="humidity">--%</strong>
      </div>
      <div class="meta-item">
        <small>Vento</small>
        <strong id="wind">-- km/h</strong>
      </div>
    </section>

    <p id="status" class="status"></p>
  </main>

  <script>
    const cityLabel = "Registro/SP";
    const registroCoords = { latitude: -24.4979, longitude: -47.8449 };
    const cacheKey = "clima_registro_sp_cache_v1";
    const LOW_TEMP = 15;
    const HIGH_TEMP = 32;
    const weatherCodeMap = {
      0: ["Céu limpo", "☀️"],
      1: ["Predominantemente limpo", "🌤️"],
      2: ["Parcialmente nublado", "⛅"],
      3: ["Nublado", "☁️"],
      45: ["Névoa", "🌫️"],
      48: ["Névoa com gelo", "🌫️"],
      51: ["Garoa fraca", "🌦️"],
      53: ["Garoa moderada", "🌦️"],
      55: ["Garoa forte", "🌧️"],
      61: ["Chuva fraca", "🌦️"],
      63: ["Chuva moderada", "🌧️"],
      65: ["Chuva forte", "🌧️"],
      71: ["Neve fraca", "🌨️"],
      73: ["Neve moderada", "🌨️"],
      75: ["Neve forte", "❄️"],
      80: ["Pancadas fracas", "🌦️"],
      81: ["Pancadas moderadas", "🌧️"],
      82: ["Pancadas fortes", "⛈️"],
      95: ["Trovoadas", "⛈️"],
      96: ["Trovoadas com granizo", "⛈️"],
      99: ["Trovoadas intensas", "⛈️"]
    };

    const el = {
      dayName: document.getElementById("dayName"),
      fullDate: document.getElementById("fullDate"),
      clock: document.getElementById("clock"),
      temp: document.getElementById("temp"),
      description: document.getElementById("description"),
      icon: document.getElementById("icon"),
      feelsLike: document.getElementById("feelsLike"),
      humidity: document.getElementById("humidity"),
      wind: document.getElementById("wind"),
      status: document.getElementById("status"),
      rain: document.getElementById("rain")
    };

    function setStatus(text = "") {
      el.status.textContent = text;
    }

    function updateRainEffect(weatherCode) {
      const rainCodes = [51, 53, 55, 61, 63, 65, 80, 81, 82, 95, 96, 99];
      el.rain.classList.toggle("show", rainCodes.includes(weatherCode));
    }

    function formatHour(timestamp) {
      return new Date(timestamp).toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function updateClock() {
      const now = new Date();
      el.clock.textContent = now.toLocaleTimeString("pt-BR", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
      const day = now.toLocaleDateString("pt-BR", { weekday: "long" });
      el.dayName.textContent = day.charAt(0).toUpperCase() + day.slice(1);
      el.fullDate.textContent = now.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "long",
        year: "numeric"
      });
    }

    function applyTemperatureTone(target, value) {
      target.classList.remove("is-cold", "is-hot");
      if (value <= LOW_TEMP) target.classList.add("is-cold");
      if (value >= HIGH_TEMP) target.classList.add("is-hot");
    }

    function initRainDrops(total = 70) {
      if (el.rain.dataset.ready === "true") return;

      for (let i = 0; i < total; i += 1) {
        const drop = document.createElement("span");
        drop.className = "drop";
        drop.style.left = `${Math.random() * 100}%`;
        drop.style.height = `${14 + Math.random() * 18}px`;
        drop.style.opacity = `${0.25 + Math.random() * 0.5}`;
        drop.style.animationDuration = `${0.55 + Math.random() * 0.7}s`;
        drop.style.animationDelay = `${Math.random() * -2}s`;
        el.rain.appendChild(drop);
      }

      el.rain.dataset.ready = "true";
    }

    function renderWeather(current, options = {}) {
      const { cached = false, timestamp = Date.now() } = options;
      const [desc, icon] = weatherCodeMap[current.weather_code] || ["Condição desconhecida", "🌍"];

      el.temp.textContent = `${Math.round(current.temperature_2m)}°C`;
      el.description.textContent = desc;
      el.icon.textContent = icon;
      el.feelsLike.textContent = `${Math.round(current.apparent_temperature)}°C`;
      el.humidity.textContent = `${Math.round(current.relative_humidity_2m)}%`;
      el.wind.textContent = `${Math.round(current.wind_speed_10m)} km/h`;
      applyTemperatureTone(el.temp, current.temperature_2m);
      applyTemperatureTone(el.feelsLike, current.apparent_temperature);

      updateRainEffect(current.weather_code);
      setStatus(cached
        ? `Dados locais (${formatHour(timestamp)}). Atualizando...`
        : `Atualizado às ${formatHour(timestamp)} para ${cityLabel}.`);
    }

    function readCache() {
      try {
        const raw = localStorage.getItem(cacheKey);
        return raw ? JSON.parse(raw) : null;
      } catch {
        return null;
      }
    }

    function writeCache(current) {
      try {
        localStorage.setItem(cacheKey, JSON.stringify({
          timestamp: Date.now(),
          current
        }));
      } catch {
        // Ignora erro de armazenamento.
      }
    }

    async function fetchWeather() {
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 7000);
      const weatherUrl = `https://api.open-meteo.com/v1/forecast?latitude=${registroCoords.latitude}&longitude=${registroCoords.longitude}&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m&timezone=America%2FSao_Paulo`;

      try {
        const weatherRes = await fetch(weatherUrl, { signal: controller.signal });
        if (!weatherRes.ok) throw new Error("Não foi possível carregar o clima.");
        const weatherData = await weatherRes.json();
        return weatherData.current;
      } finally {
        clearTimeout(timeout);
      }
    }

    async function getWeather() {
      try {
        const current = await fetchWeather();
        renderWeather(current);
        writeCache(current);
      } catch {
        setStatus("Sem atualização agora. Exibindo último dado disponível.");
      }
    }

    const cachedData = readCache();
    initRainDrops();
    if (cachedData?.current) {
      renderWeather(cachedData.current, {
        cached: true,
        timestamp: cachedData.timestamp || Date.now()
      });
    } else {
      setStatus("Buscando dados meteorológicos...");
    }

    getWeather();
    setInterval(getWeather, 10 * 60 * 1000);
    updateClock();
    setInterval(updateClock, 1000);
  </script>
</body>
</html>
